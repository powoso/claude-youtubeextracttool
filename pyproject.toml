[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "youtube-learning-extractor"
version = "1.0.0"
description = "Extract structured learning materials from YouTube videos using Claude AI"
requires-python = ">=3.10"
dependencies = [
    "youtube-transcript-api>=0.6.1",
    "anthropic>=0.39.0",
    "click>=8.1.7",
]

[project.scripts]
yt-learn = "youtube_learning_extractor.main:cli"

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
]
