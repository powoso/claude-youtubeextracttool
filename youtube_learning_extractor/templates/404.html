{% extends "base.html" %}

    <svg class="w-8 h-8 text-gray-400" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 9v3.75m9-.75a9 9 0 11-18 0 9 9 0 0118 0zm-9 3.75h.008v.008H12v-.008z"/></svg>
  </div>

  <a href="/" class="px-5 py-2.5 bg-brand-500 text-white font-semibold rounded-xl hover:bg-brand-600 shadow-md shadow-brand-200">Go Home</a>
</div>
{% endblock %}
